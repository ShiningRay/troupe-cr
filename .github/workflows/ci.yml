name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  crystal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22"
      - run: crystal spec
      - run: crystal tool format --check src spec
      - run: crystal build src/troupe.cr --no-codegen
